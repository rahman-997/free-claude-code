name: Apply FCC hardening

on:
  push:
    branches:
      - audit/full-stack-hardening-2026-09-04

permissions:
  contents: write

concurrency:
  group: apply-fcc-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assemble and verify audited patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e6f2633b69694742232452c93b9785e44fbe684f HEAD
          cat .fcc-hardening/part-*.patch > /tmp/fcc-hardening.patch
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/fcc-hardening.patch')
          patch = path.read_text(encoding='utf-8')
          for target in (
              'tests/config/test_config.py',
              'tests/cli/test_entrypoints.py',
              '.github/workflows/tests.yml',
          ):
              pattern = re.compile(
                  rf'(?ms)^diff --git a/{re.escape(target)} b/{re.escape(target)}\n.*?(?=^diff --git |\Z)'
              )
              patch, count = pattern.subn('', patch)
              if count != 1:
                  raise SystemExit(f'expected one patch block for {target}, found {count}')
          path.write_text(patch, encoding='utf-8')
          PY
          echo 'e4598c4facc8b9639f1e2627f33fe975ccbb659a2d2d57b7148d4149bce5f2c0  /tmp/fcc-hardening.patch' | sha256sum -c -
          git apply --check --recount /tmp/fcc-hardening.patch
          git apply --recount /tmp/fcc-hardening.patch

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/runtime/test_application_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "Reload Admin and retry" in result["errors"][0]\n'
          new = (
              '    errors = result.get("errors")\n'
              '    assert isinstance(errors, list)\n'
              '    assert errors and isinstance(errors[0], str)\n'
              '    assert "Reload Admin and retry" in errors[0]\n'
          )
          if old not in text:
              raise SystemExit('expected Admin conflict assertion was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/config/test_hardening_defaults.py <<'PY'
          from free_claude_code.config.settings import Settings


          def test_default_host_is_loopback() -> None:
              assert Settings().host == '127.0.0.1'


          def test_explicit_wildcard_host_remains_supported() -> None:
              assert Settings.model_validate({'HOST': '0.0.0.0'}).host == '0.0.0.0'
          PY

          cat > tests/cli/test_codex_hardening.py <<'PY'
          import pytest

          from free_claude_code.cli.launchers import codex
          from free_claude_code.config.settings import Settings


          def test_codex_hoists_caller_config_before_fcc_route_overrides() -> None:
              command = codex.build_codex_launcher_command(
                  binary_path='resolved-codex',
                  argv=(
                      'exec',
                      '-c',
                      'features.example=true',
                      '--config=model_provider=caller-provider',
                      'hello',
                      '--',
                      '-c',
                      'literal-after-separator',
                  ),
                  settings=Settings(),
                  proxy_root_url='http://127.0.0.1:9191',
              )

              exec_index = command.index('exec')
              caller_feature_index = command.index('features.example=true')
              caller_provider_index = command.index('model_provider=caller-provider')
              fcc_provider_index = command.index('model_provider="fcc"')
              assert caller_feature_index < exec_index
              assert caller_provider_index < fcc_provider_index < exec_index
              assert command[exec_index:] == [
                  'exec',
                  'hello',
                  '--',
                  '-c',
                  'literal-after-separator',
              ]


          @pytest.mark.parametrize(
              ('argument', 'expected_option', 'expected_value'),
              (('-c=foo=1', '-c', 'foo=1'), ('--config=bar=2', '--config', 'bar=2')),
          )
          def test_codex_normalizes_equals_config_overrides(
              argument: str, expected_option: str, expected_value: str
          ) -> None:
              config_args, remaining = codex.partition_codex_config_overrides(
                  ('exec', argument, 'hi')
              )
              assert config_args == [expected_option, expected_value]
              assert remaining == ['exec', 'hi']
          PY

          rm -rf .fcc-hardening
          git diff --check

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.16'
          enable-cache: false

      - name: Install project Python and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(tr -d '[:space:]' < .python-version)"
          uv python install "$python_version"
          uv sync --frozen

      - name: Format and run static quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format
          uv run ruff format --check
          uv run ruff check
          uv run ty check
          git diff --check

      - name: Run focused hardening regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q -n 0 \
            tests/config/test_hardening_defaults.py \
            tests/cli/test_codex_hardening.py \
            tests/core/test_trace.py \
            tests/api/test_model_listing.py \
            tests/application/test_routing.py \
            tests/providers/test_open_router.py \
            tests/config/test_admin_config_conflicts.py \
            tests/runtime/test_application_runtime.py \
            tests/core/test_output_token_validation.py

      - name: Commit verified hardening changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'FCC Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden routing installers security and provider boundaries [hardening-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
