name: Diagnose pytest

on:
  push:
    branches:
      - hardening/free-claude-code-2026-09-04

permissions:
  contents: write

jobs:
  patch-muse-portability:
    if: ${{ !contains(github.event.head_commit.message, '[muse-portability]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Add non-Windows lifecycle-lock identity fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = '''function Get-MuseLifecycleMutexName {
              try {
                  $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
                  $sid = [string] $identity.User.Value
              }
              catch {
                  throw "Could not determine the current Windows user for Muse lifecycle locking."
              }
              if ([string]::IsNullOrWhiteSpace($sid)) {
                  throw "Could not determine the current Windows user for Muse lifecycle locking."
              }
              # Global namespace serializes the same user's lifecycle across Terminal Services sessions.
              return "Global\\FreeClaudeCodeMuseLifecycle-$sid"
          }
          '''

          new = '''function Get-MuseLifecycleMutexName {
              $isWindowsPlatform = [Environment]::OSVersion.Platform -eq [PlatformID]::Win32NT
              if (-not $isWindowsPlatform) {
                  $userName = [Environment]::UserName
                  if ([string]::IsNullOrWhiteSpace($userName)) {
                      throw "Could not determine the current user for Muse lifecycle locking."
                  }
                  $safeUserName = $userName -replace "[^A-Za-z0-9_.-]", "_"
                  return "FreeClaudeCodeMuseLifecycle-$safeUserName"
              }

              try {
                  $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
                  $sid = [string] $identity.User.Value
              }
              catch {
                  throw "Could not determine the current Windows user for Muse lifecycle locking."
              }
              if ([string]::IsNullOrWhiteSpace($sid)) {
                  throw "Could not determine the current Windows user for Muse lifecycle locking."
              }
              # Global namespace serializes the same user's lifecycle across Terminal Services sessions.
              return "Global\\FreeClaudeCodeMuseLifecycle-$sid"
          }
          '''

          for relative in ("scripts/install-muse.ps1", "scripts/uninstall-muse.ps1"):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"expected lifecycle mutex function not found in {relative}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          pwsh -NoProfile -Command '
            . ./scripts/install-muse.ps1
            $installer = Get-MuseLifecycleMutexName
            . ./scripts/uninstall-muse.ps1
            $uninstaller = Get-MuseLifecycleMutexName
            if ($installer -ne $uninstaller) { throw "Lifecycle mutex names differ." }
            if ([string]::IsNullOrWhiteSpace($installer)) { throw "Lifecycle mutex name is empty." }
            Write-Host $installer
          '

      - name: Commit portability fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/install-muse.ps1 scripts/uninstall-muse.ps1; then
            echo "Muse portability fix is already present."
            exit 0
          fi
          git config user.name 'FCC Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/install-muse.ps1 scripts/uninstall-muse.ps1
          git commit -m 'fix: keep Muse lifecycle locking testable cross-platform [muse-portability]'
          git push origin HEAD:${GITHUB_REF_NAME}

  first-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Read Python version
        id: python
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .python-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.16'
          enable-cache: false

      - name: Install Python and dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv python install "${{ steps.python.outputs.version }}"
          uv sync --frozen

      - name: Capture first pytest failure
        id: pytest
        shell: bash
        run: |
          set +e
          uv run pytest -x -q -n 0 > "$RUNNER_TEMP/pytest-full.log" 2>&1
          status=$?
          tail -n 250 "$RUNNER_TEMP/pytest-full.log" > "$RUNNER_TEMP/pytest-failure-tail.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/pytest-failure-tail.log"
          exit 0

      - name: Upload pytest diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-first-failure
          path: ${{ runner.temp }}/pytest-failure-tail.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when pytest failed
        if: steps.pytest.outputs.status != '0'
        shell: bash
        run: exit 1
